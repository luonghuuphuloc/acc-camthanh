  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

      <tr>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.tt }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px;\">{{ r.ten }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.namSinh }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px;\">{{ r.queQuan }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px;\">{{ r.capBac }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.hySinh }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.khu }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.hang }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.mo }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px; text-align: center;\">{{ r.trangThai }}<\u002Ftd>\n                  <td style=\"border: 1px solid #000; padding: 3px 5px;\">{{ r.ghiChu }}<\u002Ftd>\n                <\u002Ftr>\n              \n            <\u002Ftbody>\n          <\u002Ftable>\n          <div style=\"font-size: 12px; margin-top: 12px;\">{{ printSummary }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;phuongAn&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;Trang nghiêm&quot;, &quot;Sa bàn số&quot;, &quot;Hoàng hôn tri ân&quot;], &quot;default&quot;: &quot;Trang nghiêm&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Phong cách 3D&quot; },\n  &quot;doBong&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Hiển thị&quot; },\n  &quot;nhanHang&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Hiển thị&quot; }\n}\">\nclass Component extends DCLogic {\n  state = {\n    ready: false, graves: [], stats: null,\n    q: '', results: null,\n    selId: null, selTrong: false,\n    menuOpen: false, preset: null,\n    chip: null, toast: '', qrOpen: false,\n    aiText: '', aiBusy: false, speaking: false,\n    noteVal: '', printOpen: false\n  };\n\n  /* ---------- vòng đời ---------- */\n  componentDidMount() {\n    this._onReady = (e) => {\n      const { graves, stats } = e.detail;\n      this.setState({ ready: true, graves, stats });\n      this._applyProps(true);\n      setTimeout(() => this._openFromHash(), 900);\n      this._flash('Kéo để xoay · 2 ngón để di chuyển · Chạm vào mộ để xem hồ sơ', 6000);\n    };\n    this._onSelect = (e) => {\n      const { id, trong } = e.detail;\n      if (!id) { if (this.state.selId) this._closeSheet(); return; }\n      this._openProfile(id, trong, false);\n    };\n    document.addEventListener('cemetery-ready', this._onReady);\n    document.addEventListener('cemetery-select', this._onSelect);\n    if (window.__cemetery && window.__cemetery.ready) {\n      this.setState({ ready: true, graves: window.__cemetery.graves, stats: window.__cemetery.stats });\n      this._applyProps(true);\n    }\n    this._onAfterPrint = () => this.setState({ printOpen: false });\n    window.addEventListener('afterprint', this._onAfterPrint);\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener('cemetery-ready', this._onReady);\n    document.removeEventListener('cemetery-select', this._onSelect);\n    window.removeEventListener('afterprint', this._onAfterPrint);\n  }\n\n  componentDidUpdate(prevProps) {\n    if (prevProps.phuongAn !== this.props.phuongAn || prevProps.doBong !== this.props.doBong || prevProps.nhanHang !== this.props.nhanHang) {\n      this._applyProps();\n    }\n  }\n\n  _presetCode() {\n    const map = { 'Trang nghiêm': 'A', 'Sa bàn số': 'B', 'Hoàng hôn tri ân': 'C' };\n    return this.state.preset || map[this.props.phuongAn] || 'A';\n  }\n\n  _applyProps(initial) {\n    const c = window.__cemetery; if (!c || !c.ready) return;\n    const code = this._presetCode();\n    c.setPreset(code);\n    c.setShadows(this.props.doBong ?? true);\n    c.setRowLabels(this.props.nhanHang ?? true);\n    if (initial) this.setState({ preset: code });\n  }\n\n  /* ---------- tiện ích ---------- */\n  _fold(s) { return (s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase(); }\n  _flash(msg, ms) { clearTimeout(this._toastT); this.setState({ toast: msg }); this._toastT = setTimeout(() => this.setState({ toast: '' }), ms || 2600); }\n  _cem() { return (window.__cemetery && window.__cemetery.ready) ? window.__cemetery : null; }\n  _find(id) { const c = this._cem(); return c ? c.find(id) : null; }\n\n  _statusMeta(k) {\n    return {\n      xacdinh: { label: 'Đã xác định thông tin', color: '#b23c2e', bg: '#f8e7e4', bd: '#e8c2bb' },\n      chuaxd: { label: 'Chưa xác định đầy đủ', color: '#5b6670', bg: '#eceff1', bd: '#cfd6db' },\n      didoi: { label: 'Đã di dời hài cốt', color: '#77584a', bg: '#f0e6e0', bd: '#d9c5ba' }\n    }[k] || { label: k, color: '#5b6670', bg: '#eceff1', bd: '#cfd6db' };\n  }\n\n  _overrides() { try { return JSON.parse(localStorage.getItem('ntlsTB.overrides.v1') || '{}'); } catch (e) { return {}; } }\n  _saveOverride(id, patch) {\n    const o = this._overrides();\n    o[id] = Object.assign({}, o[id], patch);\n    localStorage.setItem('ntlsTB.overrides.v1', JSON.stringify(o));\n  }\n\n  /* ---------- hồ sơ ---------- */\n  _openProfile(id, trong, fly) {\n    const g = this._find(id); if (!g) return;\n    window.speechSynthesis && speechSynthesis.cancel();\n    const c = this._cem();\n    if (fly && ), 4000);\n    this.setState({ menuOpen: false });\n    this._flash('Đã tải file CSV — mở bằng Excel');\n  }\n\n  /* ---------- AI & đọc ---------- */\n  async _ai() {\n    const g = this._find(this.state.selId); if (!g || this.state.aiBusy) return;\n    if (!window.claude || !window.claude.complete) { this._flash('Tính năng AI chưa khả dụng trong môi trường này'); return; }\n    this.setState({ aiBusy: true, aiText: '' });\n    const unnamed = g.status === 'chuaxd' || /chưa xác định/i.test(g.ten || '');\n    const info = [\n      unnamed ? 'Liệt sĩ chưa xác định được tên' : 'Liệt sĩ ' + g.ten,\n      g.namSinh && 'sinh năm ' + g.namSinh,\n      g.queQuan && 'quê quán ' + g.queQuan,\n      g.capBac && 'cấp bậc/chức vụ: ' + g.capBac,\n      g.donVi && 'đơn vị: ' + g.donVi,\n      g.hySinh && 'hy sinh: ' + g.hySinh,\n      g.noiHySinh && 'nơi hy sinh: ' + g.noiHySinh,\n      'an táng tại ' + g.viTri + ', Nghĩa trang liệt sĩ Núi Thiên Bút, phường Cẩm Thành, Quảng Ngãi'\n    ].filter(Boolean).join('; ');\n    try {\n      const text = await window.claude.complete({\n        system: 'Bạn là người viết văn tưởng niệm cho nghĩa trang liệt sĩ Việt Nam. Văn phong trang trọng, xúc động, thành kính, thuần Việt, không sáo rỗng. Không bịa thêm chi tiết tiểu sử không được cung cấp. Chỉ trả về bài văn, không lời dẫn.',\n        messages: [{ role: 'user', content: 'Viết một bài tưởng niệm ngắn (khoảng 6-8 câu) để thân nhân đọc khi thăm viếng. Thông tin: ' + info }],\n        max_tokens: 700\n      });\n      this.setState({ aiText: (text || '').trim(), aiBusy: false });\n    } catch (e) {\n      this.setState({ aiBusy: false });\n      this._flash('Không tạo được bài tưởng niệm — thử lại sau');\n    }\n  }\n\n  _speak() {\n    if (!('speechSynthesis' in window)) { this._flash('Thiết bị không hỗ trợ đọc văn bản'); return; }\n    if (this.state.speaking) { speechSynthesis.cancel(); this.setState({ speaking: false }); return; }\n    const g = this._find(this.state.selId); if (!g) return;\n    const parts = this.state.aiText ? [this.state.aiText] : [\n      g.status === 'chuaxd' ? 'Mộ liệt sĩ chưa xác định được tên.' : 'Liệt sĩ ' + g.ten + '.',\n      g.namSinh ? 'Sinh năm ' + g.namSinh + '.' : '',\n      g.queQuan ? 'Quê quán ' + g.queQuan + '.' : '',\n      g.capBac ? 'Cấp bậc, chức vụ: ' + g.capBac + '.' : '',\n      g.donVi ? 'Đơn vị: ' + g.donVi + '.' : '',\n      g.hySinh ? 'Hy sinh ' + g.hySinh + '.' : '',\n      'An táng tại ' + g.viTri + ', nghĩa trang liệt sĩ Núi Thiên Bút.'\n    ];\n    const u = new SpeechSynthesisUtterance(parts.filter(Boolean).join(' '));\n    u.lang = 'vi-VN'; u.rate = 0.95;\n    u.onend = () => this.setState({ speaking: false });\n    speechSynthesis.cancel(); speechSynthesis.speak(u);\n    this.setState({ speaking: true });\n  }\n\n  async _qr() {\n    this.setState({ qrOpen: true });\n    try {\n      const url = location.origin + location.pathname + '#mo=' + encodeURIComponent(this.state.selId);\n      if (window.QRCode && !window.QRCode.toCanvas) {\n        // bản UMD qrcodejs (offline): tự vẽ vào phần tử chứa\n        if (this._qrHostEl) { this._qrHostEl.innerHTML = ''; new window.QRCode(this._qrHostEl, { text: url, width: 240, height: 240, colorDark: '#2a2622', colorLight: '#fffdf8' }); }\n        return;\n      }\n      const QR = (window.QRCode && window.QRCode.toCanvas) ? window.QRCode : (await import('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm')).default;\n      const cv = document.createElement('canvas');\n      await QR.toCanvas(cv, url, { width: 240, margin: 1, color: { dark: '#2a2622', light: '#fffdf8' } });\n      if (this._qrHostEl) { this._qrHostEl.innerHTML = ''; this._qrHostEl.appendChild(cv); }\n    } catch (e) {\n      if (this._qrHostEl) this._qrHostEl.textContent = 'Không tạo được mã QR';\n    }\n  }\n\n  /* ---------- renderVals ---------- */\n  renderVals() {\n    const st = this.state;\n    const stats = st.stats || { tong: 326, xacdinh: 0, chuaxd: 0, didoi: 0, moLon: 0 };\n    const cem = () => this._cem();\n\n    /* tìm kiếm */\n    const results = (st.results || []).map(g => {\n      const sm = this._statusMeta(g.status);\n      return {\n        ten: g.ten || '—', tenColor: g.status === 'chuaxd' ? '#7d8790' : '#2a2622',\n        viTri: g.viTri, ma: g.pos ? g.id : '', dot: sm.color,\n        onPick: () => this._openProfile(g.id, false, true)\n      };\n    });\n\n    /* phương án */\n    const presets = [\n      { code: 'A', label: 'Trang nghiêm', swatch: 'linear-gradient(160deg, #d7e6f0 45%, #74975c 55%)' },\n      { code: 'B', label: 'Sa bàn số', swatch: 'linear-gradient(160deg, #101b26 45%, #2a7a63 55%)' },\n      { code: 'C', label: 'Hoàng hôn', swatch: 'linear-gradient(160deg, #f4c890 45%, #6d7c46 55%)' }\n    ];\n    const curPreset = this._presetCode();\n    const presetBtns = presets.map(p => ({\n      label: p.label, swatch: p.swatch,\n      style: 'border: none; border-radius: 999px; padding: 9px 13px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all .15s;' +\n        (curPreset === p.code ? 'background: #fffdf8; color: #2a2622; box-shadow: 0 2px 10px rgba(0,0,0,.3);' : 'background: transparent; color: rgba(255,253,248,.85);'),\n      onTap: () => { this.setState({ preset: p.code }); const c = cem(); if (c) c.setPreset(p.code); }\n    }));\n\n    /* chips thống kê */\n    const chipDefs = [\n      { key: null, label: 'Toàn bộ', count: stats.tong, dot: '#d2a24c' },\n      { key: 'xacdinh', label: 'Đã xác định', count: stats.xacdinh, dot: '#c9473a' },\n      { key: 'chuaxd', label: 'Chưa xác định', count: stats.chuaxd, dot: '#9aa2a8' },\n      { key: 'didoi', label: 'Đã di dời', count: stats.didoi, dot: '#8a6a58' },\n      { key: 'moLon', label: 'Mộ lớn', count: stats.moLon, dot: '#0f9d8f' }\n    ];\n    const chips = chipDefs.map(d => ({\n      label: d.label, count: d.count, dot: d.dot,\n      style: 'flex: 0 0 auto; display: flex; align-items: center; border: 1px solid; border-radius: 999px; padding: 9px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: all .15s;' +\n        (st.chip === d.key || (d.key === null && !st.chip)\n          ? 'background: #fffdf8; color: #2a2622; border-color: #fffdf8; box-shadow: 0 4px 14px rgba(0,0,0,.25);'\n          : 'background: rgba(24,20,16,.55); color: #f0e9da; border-color: rgba(255,253,248,.25); backdrop-filter: blur(4px);'),\n      onTap: () => {\n        const key = d.key === st.chip ? null : d.key;\n        this.setState({ chip: key });\n        const c = cem(); if (!c) return;\n        if (!key) { c.highlightGroup(null); }\n        else {\n          const ids = st.graves.filter(g => key === 'moLon' ? g.moLon : g.status === key).map(g => g.id);\n          c.highlightGroup(ids);\n          this._flash(d.label + ': ' + d.count + ' mộ — các mộ khác được làm mờ');\n        }\n      }\n    }));\n\n    /* hồ sơ đang chọn */\n    const g = st.selId ? this._find(st.selId) : null;\n    const sm = g && !g.trong ? this._statusMeta(g.status) : null;\n    const selFields = [];\n    if (g && !g.trong) {\n      const add = (k, v) => { if (v) selFields.push({ k, v: String(v) }); };\n      add('Năm sinh', g.namSinh);\n      add('Quê quán', g.queQuan);\n      add('Cấp bậc, chức vụ', g.capBac);\n      add('Đơn vị', g.donVi);\n      add('Hy sinh', g.hySinh);\n      add('Nơi hy sinh', g.noiHySinh);\n      add('Ghi chú hồ sơ', g.ghiChu);\n      if (!selFields.length) selFields.push({ k: 'Hồ sơ', v: 'Chưa có thông tin chi tiết — đang tiếp tục rà soát' });\n    }\n    const statusPills = g && !g.trong ? ['xacdinh', 'chuaxd', 'didoi'].map(k => {\n      const m = this._statusMeta(k);\n      const act = g.status === k;\n      return {\n        label: m.label,\n        style: 'border-radius: 999px; padding: 9px 13px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid ' + (act ? m.color : '#e4ded2') + ';' +\n          (act ? 'background: ' + m.bg + '; color: ' + m.color + ';' : 'background: #fff; color: #8a8377;'),\n        onTap: () => {\n          this._saveOverride(g.id, { status: k });\n          const c = cem(); if (c) { const ns = c.setStatus(g.id, k); this.setState({ stats: Object.assign({}, ns) }); }\n          this._flash('Đã cập nhật trạng thái (lưu trên thiết bị này)');\n        }\n      };\n    }) : [];\n\n    return {\n      loading: !st.ready,\n      tongLabel: stats.tong + ' mộ',\n      /* tìm kiếm */\n      q: st.q, hasQuery: !!st.q,\n      onQ: (e) => {\n        const q = e.target.value;\n        if (!q.trim()) { this.setState({ q, results: null }); return; }\n        const f = this._fold(q.trim());\n        const res = st.graves.filter(gr =>\n          this._fold(gr.ten).includes(f) || this._fold(gr.id).includes(f) || this._fold(gr.viTri).includes(f)\n        ).slice(0, 8);\n        this.setState({ q, results: res });\n      },\n      onClearQ: () => this.setState({ q: '', results: null }),\n      hasResults: !!st.results, results, noMatch: st.results && !st.results.length,\n      /* menu */\n      menuOpen: st.menuOpen,\n      toggleMenu: () => this.setState({ menuOpen: !st.menuOpen }),\n      onPrint: () => { this.setState({ menuOpen: false, printOpen: true, selId: null }); },\n      onCsv: () => this._csv(),\n      onDirections: () => { window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent('Nghĩa trang liệt sĩ Núi Thiên Bút, Quảng Ngãi'), '_blank'); this.setState({ menuOpen: false }); },\n      /* phương án + điều khiển */\n      presetBtns,\n      onResetView: () => { const c = cem(); if (c) c.resetView(); this.setState({ chip: null, selId: null }); if (c) c.highlightGroup(null); },\n      onZoomIn: () => { const c = cem(); if (c) c.zoomBy(0.78); },\n      onZoomOut: () => { const c = cem(); if (c) c.zoomBy(1.28); },\n      /* chips */\n      chips, noSheet: !st.selId && !st.printOpen,\n      toast: st.toast,\n      /* hồ sơ */\n      hasSel: !!st.selId && !!g,\n      selMa: g ? (g.pos ? g.id : 'HỒ SƠ ' + (g.tt || '')) : '',\n      selTen: g ? (g.trong ? 'Vị trí trống' : (g.ten || '—')) : '',\n      selTenColor: g && (g.trong || g.status === 'chuaxd') ? '#7d8790' : '#2a2622',\n      selViTri: g ? g.viTri : '',\n      selStatusLabel: sm ? sm.label : (g && g.trong ? 'Ô mộ dự phòng' : ''),\n      selStatusStyle: 'font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 10px; border: 1px solid ' + (sm ? sm.bd : '#cfd6db') + '; color: ' + (sm ? sm.color : '#5b6670') + '; background: ' + (sm ? sm.bg : '#eceff1') + ';',\n      selIsTrong: !!(g && g.trong),\n      selNoPos: !!(g && !g.trong && !g.pos),\n      selShowBody: !!(g && !g.trong),\n      selFields, statusPills,\n      onCloseSheet: () => this._closeSheet(),\n      noteVal: st.noteVal,\n      onNote: (e) => this.setState({ noteVal: e.target.value }),\n      onSaveNote: () => {\n        if (!g) return;\n        this._saveOverride(g.id, { note: st.noteVal });\n        const c = cem(); if (c) c.setNote(g.id, st.noteVal);\n        this._flash('Đã lưu ghi chú (trên thiết bị này)');\n      },\n      /* hành động */\n      aiBtnLabel: st.aiBusy ? 'Đang viết bài tưởng niệm…' : 'Bài tưởng niệm (AI)',\n      onAi: () => this._ai(),\n      aiText: st.aiText,\n      speakLabel: st.speaking ? 'Dừng đọc' : 'Đọc thuyết minh',\n      onSpeak: () => this._speak(),\n      onQr: () => this._qr(),\n      qrOpen: st.qrOpen, qrMa: st.selId || '',\n      qrUrl: location.origin + location.pathname + '#mo=' + encodeURIComponent(st.selId || ''),\n      qrHost: (el) => { this._qrHostEl = el; },\n      closeQr: () => this.setState({ qrOpen: false }),\n      /* in ấn */\n      printOpen: st.printOpen,\n      closePrint: () => this.setState({ printOpen: false }),\n      doPrint: () => window.print(),\n      printDate: 'ngày ' + new Date().getDate() + ' tháng ' + (new Date().getMonth() + 1) + ' năm ' + new Date().getFullYear(),\n      printRows: st.printOpen ? this._sorted().map(gr => ({\n        tt: gr.tt, ten: gr.ten || '', namSinh: gr.namSinh || '', queQuan: gr.queQuan || '',\n        capBac: [gr.capBac, gr.donVi].filter(Boolean).join(' — '), hySinh: gr.hySinh || '',\n        khu: gr.khu || '—', hang: gr.hang ?? '', mo: gr.mo ?? '',\n        trangThai: this._statusMeta(gr.status).label.replace(' thông tin', '').replace(' đầy đủ', '').replace(' hài cốt', ''),\n        ghiChu: [gr.ghiChu, gr.note].filter(Boolean).join(' · ')\n      })) : [],\n      printSummary: 'Tổng cộng: ' + stats.tong + ' mộ — Đã xác định: ' + stats.xacdinh + ' · Chưa xác định: ' + stats.chuaxd + ' · Đã di dời: ' + stats.didoi + ' · Mộ lớn: ' + stats.moLon + '.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
